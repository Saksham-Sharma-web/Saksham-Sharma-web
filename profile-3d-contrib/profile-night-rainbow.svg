<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%" style="background:#0d1117; border-radius: 12px; border: 1px solid rgba(108,99,255,0.2);">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #00D4FF; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    .iso-top { fill: #26a641; }
    .iso-left { fill: #006d32; }
    .iso-right { fill: #0e4429; }
    .iso-top-high { fill: #00D4FF; filter: url(#blockGlow); }
    .iso-left-high { fill: #6C63FF; }
    .iso-right-high { fill: #3b28cc; }
    .iso-top-mid { fill: #39d353; }
    .iso-left-mid { fill: #26a641; }
    .iso-right-mid { fill: #006d32; }
    .iso-top-low { fill: #161b22; }
    .iso-left-low { fill: #0e1117; }
    .iso-right-low { fill: #090d12; }
  </style>

  <!-- Title -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" class="title-text">🧊 3D Contribution Landscape</text>
    <text x="0" y="18" class="sub-text">Interactive 3D isometric GitHub activity profile · Updated continuously</text>
  </g>

  <!-- Isometric 3D Grid Presentation -->
  <g transform="translate(440, 150) scale(1.1, 0.65) rotate(45)">
    <!-- Low / Base Blocks -->
    <g transform="translate(-180, -180)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="24" y="0" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="48" y="0" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="72" y="0" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="96" y="0" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="120" y="0" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="144" y="0" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="168" y="0" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="192" y="0" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="216" y="0" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="240" y="0" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="264" y="0" width="18" height="18" class="iso-top-high" rx="2"/>

      <!-- Row 1 -->
      <rect x="0" y="24" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="24" y="24" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="48" y="24" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="72" y="24" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="96" y="24" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="120" y="24" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="144" y="24" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="168" y="24" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="192" y="24" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="216" y="24" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="240" y="24" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="264" y="24" width="18" height="18" class="iso-top" rx="2"/>

      <!-- Row 2 -->
      <rect x="0" y="48" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="24" y="48" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="48" y="48" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="72" y="48" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="96" y="48" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="120" y="48" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="144" y="48" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="168" y="48" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="192" y="48" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="216" y="48" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="240" y="48" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="264" y="48" width="18" height="18" class="iso-top-mid" rx="2"/>

      <!-- Row 3 -->
      <rect x="0" y="72" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="24" y="72" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="48" y="72" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="72" y="72" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="96" y="72" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="120" y="72" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="144" y="72" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="168" y="72" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="192" y="72" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="216" y="72" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="240" y="72" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="264" y="72" width="18" height="18" class="iso-top-low" rx="2"/>

      <!-- Row 4 -->
      <rect x="0" y="96" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="24" y="96" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="48" y="96" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="72" y="96" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="96" y="96" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="120" y="96" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="144" y="96" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="168" y="96" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="192" y="96" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="216" y="96" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="240" y="96" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="264" y="96" width="18" height="18" class="iso-top-high" rx="2"/>

      <!-- Row 5 -->
      <rect x="0" y="120" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="24" y="120" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="48" y="120" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="72" y="120" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="96" y="120" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="120" y="120" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="144" y="120" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="168" y="120" width="18" height="18" class="iso-top-low" rx="2"/>
      <rect x="192" y="120" width="18" height="18" class="iso-top-high" rx="2"/>
      <rect x="216" y="120" width="18" height="18" class="iso-top-mid" rx="2"/>
      <rect x="240" y="120" width="18" height="18" class="iso-top" rx="2"/>
      <rect x="264" y="120" width="18" height="18" class="iso-top-high" rx="2"/>
    </g>
  </g>

  <!-- Status / Info Badge -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="8" height="8" rx="4" fill="#00D4FF" />
    <text x="16" y="8" class="sub-text">Saksham Sharma · Active Contribution Visualizer</text>
  </g>
</svg>
