name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Saksham-Sharma-web
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark&color_snake=#00D4FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit and Push Generated SVGs
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake [skip ci]"
          add: "github-snake*.svg"
          default_author: github_actions
